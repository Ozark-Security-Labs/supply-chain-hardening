# Flags vulnerable, malicious, or license-incompatible dependencies in
# PR diffs. This repo has no runtime dependencies today, but the action
# is wired up so any future tooling (e.g. a Node-based snippet
# validator) gets the same protection without further plumbing.

name: dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
