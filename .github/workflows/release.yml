# Tag-driven release. v0.0.1 ships a source tarball + SHA256SUMS only;
# SLSA provenance and SBOM attestations land in v0.3.0 alongside the
# Tier 3 content that documents them (so the doc and its CI evolve in
# lockstep with what the doc preaches).

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag format
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH (got: ${REF_NAME})" >&2
            exit 1
          fi

      - name: Verify tag commit is reachable from main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "${REF_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "Release tag ${REF_NAME} does not point at a commit reachable from origin/main" >&2
            exit 1
          fi

  release:
    needs: validate-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Build source tarball + checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="supply-chain-hardening-${version}/" \
            "${REF_NAME}" \
            -o "dist/supply-chain-hardening-${version}.tar.gz"
          (cd dist && sha256sum "supply-chain-hardening-${version}.tar.gz" > SHA256SUMS)

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
